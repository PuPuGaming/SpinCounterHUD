name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild \
            -project SpinCounterHUD.xcodeproj \
            -scheme SpinCounterHUD \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpinCounterHUD.app Payload/
          zip -r SpinCounterHUD.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinCounterHUD-ipa
          path: SpinCounterHUD.ipa

      - name: Build Unsigned Dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -fobjc-arc \
            -c SpinCounterDylib/HUDLoader.m \
            -o HUDLoader.o
          xcrun --sdk iphoneos swiftc \
            -O \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -emit-library \
            -module-name SpinCounterHUDDylib \
            -o SpinCounterHUD.dylib \
            -Xlinker -install_name -Xlinker @rpath/SpinCounterHUD.dylib \
            -framework UIKit \
            -framework SwiftUI \
            -framework Foundation \
            SpinCounterHUD/PassthroughWindow.swift \
            SpinCounterHUD/TrackerState.swift \
            SpinCounterHUD/HUDView.swift \
            SpinCounterDylib/HUDManager.swift \
            HUDLoader.o

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinCounterHUD-dylib
          path: SpinCounterHUD.dylib
